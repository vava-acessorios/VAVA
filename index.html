    <script>
      // Garante a barra final '/' em URLs do GitHub Pages para não quebrar caminhos relativos
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();

      // Diagnóstico automático para GitHub Pages se os módulos não forem carregados
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var preloader = document.getElementById('pre-loader');
          if (preloader && (window.location.hostname.includes('github.io') || window.location.protocol === 'file:')) {
            var tip = document.createElement('div');
            tip.style.cssText = 'margin-top:20px;padding:14px 18px;background:#171717;border:1px solid #333;border-radius:12px;max-width:440px;text-align:left;font-size:12px;line-height:1.6;color:#a3a3a3;box-shadow:0 10px 25px rgba(0,0,0,0.5);';
            tip.innerHTML = '<strong style="color:#ffffff;display:block;margin-bottom:6px;font-size:13px;">⚙️ Configuração do GitHub Pages:</strong>' +
              'Se o site não abrir, verifique se a fonte em seu repositório está configurada como <b>GitHub Actions</b>:<br>' +
              '1. Acesse o GitHub &rarr; <b>Settings &gt; Pages</b>.<br>' +
              '2. Em <b>Build and deployment &gt; Source</b>, mude para <b>GitHub Actions</b>.<br>' +
              '3. Verifique na aba <b>Actions</b> o workflow concluído com sucesso!';
            preloader.appendChild(tip);
          }
        }, 4000);
      });
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Vavá Acessórios",

      },
      "areaServed": ["Petrolina - PE", "Juazeiro - BA"],
      "sameAs": ["https://www.instagram.com/vava_acessorios/"]
    }
    </script>
  </head>
  <body class="bg-[#050505] text-[#FFFFFF] selection:bg-[#FFFFFF] selection:text-[#050505] antialiased overflow-x-hidden" style="background-color: #050505; color: #ffffff; margin: 0; min-height: 100vh;">
    <div id="root" style="min-height: 100vh; background-color: #050505; display: flex; align-items: center; justify-content: center;">
      <!-- Pré-carregamento imediato escuro: nunca fica branco -->
      <div id="pre-loader" style="text-align: center; font-family: system-ui, -apple-system, sans-serif; color: #a3a3a3; padding: 24px;">
        <div style="width: 44px; height: 44px; border: 3px solid #262626; border-top-color: #ffffff; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 0.8s linear infinite;"></div>
        <p style="font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: #ffffff; font-weight: 600; margin: 0 0 6px 0;">Vavá Acessórios</p>
        <p style="font-size: 12px; color: #737373; margin: 0;">Carregando vitrine premium...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
